<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfGuide - {% block title %}Платформа профориентации{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/">🎓 ProfGuide</a>
            </div>
            <div class="nav-menu">
                <a href="/dashboard/" class="nav-link">📊 Главная</a>
                <a href="/testing/" class="nav-link">📝 Тестирование</a>
                <a href="/professions/" class="nav-link">💼 Профессии</a>
                <a href="/chat/" class="nav-link">💬 Чат с AI</a>
                <a href="/profile/" class="nav-link">👤 Профиль</a>
                <a href="/logout/" class="nav-link logout">🚪 Выйти</a>
            </div>
        </div>
    </nav>
    {% endif %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
