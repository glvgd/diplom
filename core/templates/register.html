{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Регистрация в ProfGuide</h2>
        <p class="subtitle">Начните свой путь к профессии мечты</p>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="username" required placeholder="Придумайте username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Класс</label>
                <select name="grade">
                    <option value="9">9 класс</option>
                    <option value="10" selected>10 класс</option>
                    <option value="11">11 класс</option>
                </select>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="Придумайте пароль">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
        <p class="auth-link">
            Уже есть аккаунт? <a href="/login/">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
